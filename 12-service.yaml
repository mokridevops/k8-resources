apiVersion: v1
kind: Service
metadata:
   name: nginx
   # service labels
   labels:
      project: roboshop
      environment: dev
spec:
  # Service user the below labels from the selector to select the pods
  selector:
    project: roboshop
    tier: frontend
    component: frontend
  ports:
   - protocol: TCP
     port: 80 # service port
     targetport: 80 # container port
---
apiVersion: v1
kind: Pod
metadata:
   name: nginx
   labels:
     project: roboshop
     tier: frontend
     component: frontend
     environment: dev
spec:
  containers:
   - name: niginx
     image: nginx
  